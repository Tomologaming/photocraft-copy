name: iPadOS app target audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/photocraft/**"
      - "crates/**"
      - ".github/workflows/ipados-app-build.yml"
      - "docs/ipados-build.md"

permissions:
  contents: read

concurrency:
  group: ipados-app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-target-audit:
    name: Check full native app dependency graph for iOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Record Apple and Rust toolchains
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          rustc --version
          cargo --version
      - name: Check the iPadOS entry point and shared app dependency graph
        run: cargo check --locked --target aarch64-apple-ios -p photocraft
