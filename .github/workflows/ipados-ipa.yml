name: iPadOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/photocraft/**"
      - "crates/**"
      - "assets/app-icon/**"
      - ".github/workflows/ipados-ipa.yml"
      - "packaging/ios/**"
      - "docs/ipados-build.md"

permissions:
  contents: read

concurrency:
  group: ipados-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build unsigned iPadOS IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      SDKROOT: /Applications/Xcode.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ipados-ipa

      - name: Record toolchain and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          rustc --version
          cargo --version

      - name: Build native iPadOS executable
        run: cargo build --locked --release --target aarch64-apple-ios -p photocraft

      - name: Assemble IPA bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "photocraft"))')"
          APP_ROOT="$RUNNER_TEMP/ipa-root"
          APP_DIR="$APP_ROOT/Payload/PhotoCraft.app"
          mkdir -p "$APP_DIR"
          install -m 755 target/aarch64-apple-ios/release/photocraft "$APP_DIR/PhotoCraft"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string PhotoCraft" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string org.photocraft.editor" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string PhotoCraft" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string PhotoCraft" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $APP_VERSION" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $GITHUB_RUN_NUMBER" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 15.0" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSRequiresIPhoneOS bool true" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily array" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIDeviceFamily:0 integer 2" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities array" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UIRequiredDeviceCapabilities:0 string arm64" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:2 string UIInterfaceOrientationPortrait" "$APP_DIR/Info.plist"
          plutil -lint "$APP_DIR/Info.plist"
          test -x "$APP_DIR/PhotoCraft"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          (cd "$APP_ROOT" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/PhotoCraft-iPadOS-unsigned.ipa" Payload)
          unzip -l "$GITHUB_WORKSPACE/dist/PhotoCraft-iPadOS-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoCraft-iPadOS-unsigned-IPA
          path: dist/PhotoCraft-iPadOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
