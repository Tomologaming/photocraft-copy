name: iPadOS target probe

# Kept available for manual diagnosis; the IPA workflow is the normal iPadOS build path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-target-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-ui-target-check:
    name: Check Rust UI for aarch64-apple-ios
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          rustc --version
          cargo --version
      - name: Check shared UI and engine dependency graph for iOS
        run: cargo check --locked --target aarch64-apple-ios -p photocraft-ui-egui
