# Manual-only static checks. iPadOS IPA builds live in ipados-ipa.yml.
name: Packaging lint

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@main

  verified-appimage-inputs:
    timeout-minutes: 10
    name: Verified AppImage inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash packaging/linux/verified-download-test.sh
